name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOSCacheCleaner
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Check project
        run: |
          set -e

          echo "=== Current directory ==="
          pwd

          echo "=== Project ==="
          ls -la

          echo "=== Xcode project ==="
          ls -la iOSCacheCleaner.xcodeproj

          echo "=== Project file ==="
          ls -lh iOSCacheCleaner.xcodeproj/project.pbxproj

      - name: Validate project
        run: |
          set -e

          xcodebuild \
            -project iOSCacheCleaner.xcodeproj \
            -target iOSCacheCleaner \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project iOSCacheCleaner.xcodeproj \
            -target iOSCacheCleaner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Find built app
        run: |
          set -e

          echo "=== Searching for app ==="

          APP=$(find "$PWD/build" \
            -type d \
            -name "iOSCacheCleaner.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "❌ iOSCacheCleaner.app not found"
            echo "=== Build directory ==="
            find "$PWD/build" -maxdepth 6 -print
            exit 1
          fi

          echo "✅ Found:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/iOSCacheCleaner.app

      - name: Create unsigned IPA
        run: |
          set -e

          rm -f iOSCacheCleaner-unsigned.ipa

          cd Payload

          zip -r ../iOSCacheCleaner-unsigned.ipa iOSCacheCleaner.app

          cd ..

          echo "=== IPA ==="
          ls -lh iOSCacheCleaner-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSCacheCleaner-unsigned-IPA
          path: iOSCacheCleaner-unsigned.ipa
          if-no-files-found: error
