name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOSCacheCleaner
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Check project files
        run: |
          set -e

          echo "=== 当前目录 ==="
          pwd

          echo "=== 项目文件 ==="
          find . -maxdepth 4 \
            \( -name "*.xcodeproj" -o -name "*.swift" -o -name "Info.plist" \) \
            -print

          echo "=== project.pbxproj ==="
          ls -lh iOSCacheCleaner.xcodeproj/project.pbxproj

      - name: Validate Xcode project
        run: |
          set -e

          xcodebuild \
            -project iOSCacheCleaner.xcodeproj \
            -target iOSCacheCleaner \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project iOSCacheCleaner.xcodeproj \
            -target iOSCacheCleaner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Find built app
        run: |
          set -e

          echo "=== 搜索 APP ==="

          APP=$(find build/DerivedData/Build/Products \
            -type d \
            -name "iOSCacheCleaner.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "❌ 没有找到 iOSCacheCleaner.app"
            echo "=== Build 目录 ==="
            find build -maxdepth 7 -print
            exit 1
          fi

          echo "✅ 找到:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/iOSCacheCleaner.app

      - name: Create unsigned IPA
        run: |
          set -e

          rm -f iOSCacheCleaner-unsigned.ipa

          cd Payload

          zip -r ../iOSCacheCleaner-unsigned.ipa iOSCacheCleaner.app

          cd ..

          echo "=== IPA ==="
          ls -lh iOSCacheCleaner-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSCacheCleaner-unsigned-IPA
          path: iOSCacheCleaner-unsigned.ipa
          if-no-files-found: error
