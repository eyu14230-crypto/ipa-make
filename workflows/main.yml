name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Find Xcode project
        run: |
          find . -maxdepth 3 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

      - name: Build unsigned app
        run: |
          set -e

          PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "没有找到 .xcodeproj"
            exit 1
          fi

          SCHEME=$(xcodebuild -list \
            -project "$PROJECT" |
            sed -n '/Schemes:/,/^$/p' |
            tail -n +2 |
            sed '/^[[:space:]]*$/d' |
            head -n 1 |
            xargs)

          if [ -z "$SCHEME" ]; then
            echo "没有找到 Scheme"
            exit 1
          fi

          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

          mkdir -p build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate app
        run: |
          set -e

          APP=$(find build/DerivedData/Build/Products \
            -type d \
            -name "*.app" |
            head -n 1)

          if [ -z "$APP" ]; then
            echo "没有找到 .app"
            find build -maxdepth 6 -print
            exit 1
          fi

          echo "找到 App:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

      - name: Create unsigned IPA
        run: |
          set -e

          rm -f iOSCacheCleaner-unsigned.ipa

          cd Payload

          zip -r ../iOSCacheCleaner-unsigned.ipa *.app

          cd ..

          echo "IPA 已生成:"
          ls -lh iOSCacheCleaner-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOSCacheCleaner-unsigned-IPA
          path: iOSCacheCleaner-unsigned.ipa
          if-no-files-found: error
